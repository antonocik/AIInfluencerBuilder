<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>AI Influencer Builder — tests</title>
<style>
  body { font-family: monospace; margin: 16px; }
  #results div { padding: 2px 0; }
  #results .fail { color: #b91c1c; font-weight: bold; }
  #results .pass { color: #15803d; }
  #results .summary { margin-top: 8px; font-weight: bold; }
  iframe { width: 100%; height: 640px; border: 1px solid #cbd5e1; margin-top: 12px; }
</style>
</head>
<body>
<h1>AI Influencer Builder — tests</h1>
<div id="results"></div>
<iframe id="app" src="index.html"></iframe>
<script>
(function () {
  'use strict';

  var tests = [];
  function t(name, fn) { tests.push({ name: name, fn: fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
  function assertEq(actual, expected, msg) {
    if (actual !== expected) {
      throw new Error((msg ? msg + ': ' : '') + 'expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
    }
  }

  var frame = document.getElementById('app');
  var results = document.getElementById('results');

  function waitReady(win) {
    return new Promise(function (resolve, reject) {
      var started = Date.now();
      (function poll() {
        try {
          var doc = win.document;
          if (doc && doc.readyState === 'complete' && doc.querySelector('#builderForm')) {
            return resolve(win);
          }
        } catch (e) { /* frame navigating */ }
        if (Date.now() - started > 15000) return reject(new Error('iframe not ready in 15s'));
        setTimeout(poll, 50);
      })();
    });
  }

  function freshPage() {
    return new Promise(function (resolve, reject) {
      frame.onload = function () {
        waitReady(frame.contentWindow).then(resolve, reject);
      };
      frame.src = 'index.html?fresh=' + Date.now();
      setTimeout(function () {
        if (frame.contentWindow && frame.contentWindow.document &&
            frame.contentWindow.document.readyState === 'complete' &&
            frame.contentWindow.document.querySelector('#builderForm')) {
          resolve(frame.contentWindow);
        }
      }, 15000);
    });
  }

  function withFreshPage(fn) {
    return freshPage().then(function (win) { return fn(win); });
  }

  function line(text, cls) {
    var d = document.createElement('div');
    d.textContent = text;
    if (cls) d.className = cls;
    results.appendChild(d);
    document.title = text;
    return d;
  }

  function run() {
    var pass = 0, fail = 0;
    return waitReady(frame.contentWindow)
      .then(function (win) {
        var chain = Promise.resolve();
        tests.forEach(function (test) {
          chain = chain.then(function () {
            return Promise.resolve()
              .then(function () { return test.fn(win); })
              .then(function () { line('PASS ' + test.name, 'pass'); pass++; })
              .catch(function (err) { line('FAIL ' + test.name + ': ' + err.message, 'fail'); fail++; });
          });
        });
        return chain;
      })
      .then(function () {
        line(fail ? ('FAILURES (' + fail + ')') : ('ALL PASS (' + pass + ')'), 'summary');
      })
      .catch(function (err) {
        line('HARNESS ERROR: ' + err.message, 'fail');
      });
  }

  window.t = t;
  window.assert = assert;
  window.assertEq = assertEq;
  window.withFreshPage = withFreshPage;

  // --- Task 1 smoke test ---
  t('smoke: page loads with form', function (win) {
    assert(win.document.querySelector('#builderForm'), '#builderForm missing');
    assert(win.document.querySelector('#generateBtn'), '#generateBtn missing');
  });

  // --- Task 2: autosave + reset ---
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function setValue(win, id, value) {
    var el = win.document.getElementById(id);
    el.value = value;
    el.dispatchEvent(new win.Event('input', { bubbles: true }));
    el.dispatchEvent(new win.Event('change', { bubbles: true }));
  }

  t('autosave: input writes aib_state_v1 after debounce', async function (win) {
    setValue(win, 'charName', 'Aria Sterling');
    await sleep(700);
    var raw = win.localStorage.getItem('aib_state_v1');
    assert(raw, 'aib_state_v1 missing');
    assert(raw.indexOf('Aria Sterling') !== -1, 'value not found in state: ' + raw);
  });

  t('autosave: reload restores state', async function (win) {
    setValue(win, 'charName', 'Beta Ray');
    await sleep(700);
    await withFreshPage(function (w2) {
      assertEq(w2.document.getElementById('charName').value, 'Beta Ray', 'input restored');
      assertEq(w2.document.getElementById('previewName').textContent, 'Beta Ray', 'preview name updated');
    });
  });

  t('reset: clears form, state key, and outputs', async function (win) {
    setValue(win, 'charName', 'Gamma Delta');
    win.AIB.saveState();
    win.confirm = function () { return true; };
    win.document.getElementById('resetBtn').click();
    assertEq(win.document.getElementById('charName').value, '', 'input cleared');
    assert(win.localStorage.getItem('aib_state_v1') === null, 'state key removed');
    var pres = win.document.querySelectorAll('.output-card pre');
    assert(pres.length > 0, 'no output pre elements found');
    for (var i = 0; i < pres.length; i++) {
      assertEq(pres[i].textContent.trim(), '', 'pre not cleared: #' + (pres[i].id || i));
    }
  });

  t('reset: keeps saved profiles', async function (win) {
    win.localStorage.setItem('aib_profiles_v1', JSON.stringify([{ id: 'p1', name: 'A', savedAt: 1, state: {} }]));
    win.confirm = function () { return true; };
    win.document.getElementById('resetBtn').click();
    var p = win.localStorage.getItem('aib_profiles_v1');
    assert(p && p.indexOf('p1') !== -1, 'profiles must survive reset, got: ' + p);
  });

  t('autosave: storage failure degrades, no throw', async function (win) {
    win.Storage.prototype.setItem = function () { throw new Error('quota exceeded'); };
    var threw = null;
    try {
      setValue(win, 'charName', 'Epsilon Zeta');
      await sleep(700);
    } catch (e) { threw = e; }
    assert(!threw, 'exception escaped: ' + (threw && threw.message));
    var toast = win.document.getElementById('toast');
    assert(toast.classList.contains('show'), 'toast not visible');
    assert(toast.textContent.indexOf('Autosave') !== -1, 'unexpected toast text: ' + toast.textContent);
    assert(win.AIB._storageOff === true, 'AIB._storageOff not set');
  });

  // --- Task 3: validation ---
  t('validation: required markers present', function (win) {
    ['charName', 'charTypeSelect', 'nicheSelect'].forEach(function (id) {
      var el = win.document.getElementById(id);
      assertEq(el.getAttribute('aria-required'), 'true', id + ' aria-required');
      var label = win.document.querySelector('label[for="' + id + '"]');
      assert(label, id + ' label missing');
      assert(label.textContent.indexOf('*') !== -1, id + ' label has no *: ' + label.textContent);
    });
  });

  t('validation: empty required blocks generate', function (win) {
    ['charName', 'charTypeSelect', 'nicheSelect'].forEach(function (id) {
      var el = win.document.getElementById(id);
      el.value = '';
      el.dispatchEvent(new win.Event('input', { bubbles: true }));
      el.dispatchEvent(new win.Event('change', { bubbles: true }));
    });
    var before = win.document.getElementById('resultsSection').textContent;
    win.confirm = function () { return true; };
    win.document.getElementById('generateBtn').click();
    var err = win.document.getElementById('charNameError');
    assert(!err.classList.contains('hidden'), 'charNameError not visible');
    assert(err.textContent.trim().length > 0, 'charNameError text empty');
    assertEq(win.document.activeElement, win.document.getElementById('charName'), 'focus first invalid');
    assertEq(win.document.getElementById('resultsSection').textContent, before, 'results unchanged');
  });

  t('validation: error clears on input', function (win) {
    var el = win.document.getElementById('charName');
    el.value = 'Aria';
    el.dispatchEvent(new win.Event('input', { bubbles: true }));
    var err = win.document.getElementById('charNameError');
    assert(err.classList.contains('hidden'), 'charNameError still visible after input');
  });

  t('validation: valid form passes', function (win) {
    setValue(win, 'charName', 'Aria Sterling');
    setValue(win, 'charTypeSelect', 'Manusia');
    setValue(win, 'nicheSelect', 'Fashion');
    var v = win.AIB.validate();
    assert(v.ok, 'validate().ok should be true');
    assertEq(v.firstInvalid, null, 'firstInvalid should be null');
  });

  run();
})();
</script>
</body>
</html>
